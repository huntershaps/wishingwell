# Netlify picks up Next.js on its own and installs the OpenNext adapter, which
# provisions the function that runs SSR, server actions and route handlers. This
# file exists to be explicit about the build, not to override any of that.
#
# Two things have to be set in the Netlify UI rather than here, because they are
# secrets: TURSO_DATABASE_URL and TURSO_AUTH_TOKEN.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
